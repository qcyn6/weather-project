server:
  port: 8080

spring:
  application:
    name: weather-api
  datasource:
    # allowPublicKeyRetrieval=true: mysql-connector-j 8.x 连 5.7 服务端的必要参数
    url: jdbc:mysql://${DB_HOST:192.168.88.151}:3306/weather_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:hadoop}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 8
      connection-test-query: SELECT 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期需要看 SQL 时再打开：log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true

jwt:
  # HS256 密钥，至少 32 字节；生产环境通过环境变量注入
  secret: ${JWT_SECRET:weather-platform-jwt-secret-2026-0827}
  expire-hours: 24

manage:
  # 管理页"重跑聚类"通过 SSH 触发 node1 上的 Spark 作业
  ssh:
    host: ${NODE1_HOST:192.168.88.151}
    port: 22
    user: ${NODE1_USER:root}
    password: ${NODE1_PASSWORD:123456}
